# ==========================================
# 1. TEMAS Y ESTÉTICA
# ==========================================

# ==========================================
# PALETA DE COLORES - TEMA ADO (Inspirada en Ado's Best)
# ==========================================

# Fondo principal
background              #0B0E14
foreground              #D5DCF0  

# Selección de texto
selection_background    #1D263B
selection_foreground    #FFFFFF

# Cursor
cursor                  #38BDF8
cursor_text_color       #0B0E14

# Colores Normales
color0                  #151B26  # Carbón oscuro base
color1                  #E25B7B  # Rosa polvoso/atenuado 
color2                  #2DD4BF  # Turquesa/Cian elegante 
color3                  #EAB308  # Amarillo sutil
color4                  #38BDF8  # Cian/Azul
color5                  #A855F7  # Púrpura melancólico 
color6                  #67E8F9  # Cian pastel
color7                  #94A3B8  # Gris pizarra claro

# Colores Brillantes
color8                  #475569  # Gris oscuro de soporte / Comentarios
color9                  #FB7185  # Rosa brillante suave (alertas)
color10                 #5EEAD4  # Turquesa brillante de acento
color11                 #FDE047  # Amarillo claro
color12                 #7DD3FC  # Azul brillante claro
color13                 #C084FC  # Púrpura suave brillante
color14                 #A5F3FC  # Cian claro brillante
color15                 #F8FAFC  # Blanco puro

# Fuente Nerd Font
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Cursor y Ventana
cursor_shape beam
cursor_trail 1
window_margin_width 21.75
confirm_os_window_close 0


# ==========================================
# 2. CONFIGURACIÓN DE SHELL
# ==========================================
shell /usr/bin/bash


# ==========================================
# 3. PORTAPAPELES (COPIAR Y PEGAR)
# ==========================================
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard

map ctrl+shift+c send_text all \x03


# ==========================================
# 4. PESTAÑAS Y PANELES
# ==========================================
# Pestañas
map ctrl+t        new_tab
map ctrl+w        close_tab
map ctrl+tab      next_tab
map ctrl+shift+tab previous_tab

map ctrl+shift+enter launch --location=split


# ==========================================
# 5. UTILIDADES Y ZOOM
# ==========================================
map ctrl+f        launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map page_up       scroll_page_up
map page_down     scroll_page_down

# Zoom de fuente
map ctrl+plus     change_font_size all +1
map ctrl+equal    change_font_size all +1
map ctrl+kp_add   change_font_size all +1
map ctrl+minus    change_font_size all -1
map ctrl+underscore change_font_size all -1
map ctrl+kp_subtract change_font_size all -1
map ctrl+0        change_font_size all 0
map ctrl+kp_0     change_font_size all 0

tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge top
tab_bar_align left
